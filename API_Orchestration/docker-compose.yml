services:
  postgres:
    image: postgres:16-alpine
    container_name: apiflow-postgres
    environment:
      POSTGRES_USER: apiflow
      POSTGRES_PASSWORD: apiflow
      POSTGRES_DB: apiflow
    ports:
      - "5432:5432"
    volumes:
      - apiflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apiflow_pgdata:
