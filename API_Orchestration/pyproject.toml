[project]
name = "apiflow"
version = "0.1.0"
description = "Config-driven orchestrator that pulls REST API data into Postgres"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "croniter>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pglast>=6.0"]

[project.scripts]
apiflow = "apiflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apiflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
